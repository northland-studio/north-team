# ==========================================================================
# NorthTeam 客户端截图验收（**实验性 / 非阻塞 / 手动触发**）
#
# ⚠️ 卡点如实说明（请先读）
#   目标是在 CI 里用 xvfb + mesa 起两个离线模式无头客户端连进本地 Paper 26.2，
#   截图 tab 列表 / 聊天 / 侧边栏，作为「玩家视角」的展示性证据。
#
#   但这条路径**尚未在 CI 上跑通验证过**，已知风险点：
#     1. 26.2 客户端的 version manifest / 依赖库 / assetIndex 在 runner 上的可用性；
#     2. 客户端需要 OpenGL 上下文（靠 mesa 软渲染）+ 正确的 natives 与启动参数，
#        --quickPlayMultiplayer 在离线模式下的行为也需要实测，通常要多轮迭代；
#     3. 完整资源（assets）体积很大，这里只下 assetIndex，画面可能缺贴图。
#
#   因此本流水线：
#     · 默认**不随 push 自动运行**（只支持 workflow_dispatch 手动触发）；
#     · job 设置 continue-on-error: true，且脚本始终 exit 0 —— 绝不阻塞主验收；
#     · 无论成败都会产出 client-result.txt，写明「走到哪一步、卡在哪」。
#
#   权威验收以 server-test.yml 为准：它的 `nt status` 会 dump 游戏内真实
#   scoreboard 状态（正式队伍数/颜色/前缀/规则/侧边栏行数），
#   足以证明记分板同步真的生效，而不是只打印了几句日志。
# ==========================================================================
name: client-screenshots

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft 客户端版本（默认与 Paper 26.2 对应）'
        required: false
        default: '26.2'
      clients:
        description: '启动几个客户端'
        required: false
        default: '2'

permissions:
  contents: read

jobs:
  client-shots:
    name: 无头客户端截图（实验性，失败不阻塞）
    runs-on: ubuntu-latest
    # 尽力而为：即使失败也不让主流水线变红
    continue-on-error: true
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/274bbcb9807ad79a479617ce695a7c0686e652a8d1cabfd0e288d92a3ea29593/paper-26.2-124.jar
      PAPER_SHA256: 274bbcb9807ad79a479617ce695a7c0686e652a8d1cabfd0e288d92a3ea29593
      PAPER_JAR_NAME: paper-26.2-124.jar
      NT_API_BASE: https://xuanjian.top
      NT_TEST_CONFIG_ID: "3"
      MC_VERSION: ${{ github.event.inputs.mc_version || '26.2' }}
      CLIENTS: ${{ github.event.inputs.clients || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install xvfb / mesa / imagemagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglu1-mesa imagemagick

      - name: Build plugin jar
        run: gradle build --no-daemon --stacktrace

      - name: Download Paper and prepare server dir
        run: |
          set -euo pipefail
          JAR="$(ls build/libs/NorthTeam-*.jar | grep -v -- '-sources' | grep -v -- '-javadoc' | head -1)"
          echo "plugin jar: $JAR"
          mkdir -p .ci-server/plugins
          curl -fsSL -o ".ci-server/$PAPER_JAR_NAME" "$PAPER_URL"
          echo "$PAPER_SHA256  .ci-server/$PAPER_JAR_NAME" | sha256sum -c -
          cp "$JAR" .ci-server/plugins/
          printf 'eula=true\n' > .ci-server/eula.txt
          # 注意：server.properties 用 printf 逐行写入，**不要用 heredoc**——
          # heredoc 的内容必须与 YAML 块缩进对齐，一旦顶格写在第 1 列就会让整个
          # workflow 文件解析失败（GitHub 会直接判为 invalid workflow）。
          printf '%s\n' \
            'online-mode=false' \
            'enable-rcon=true' \
            'rcon.port=25575' \
            'rcon.password=ntcircon' \
            'motd=NorthTeam CI' \
            'spawn-protection=0' \
            'max-players=20' \
            'view-distance=4' \
            'simulation-distance=4' \
            'level-name=world' \
            'level-type=minecraft\:flat' \
            'generate-structures=false' \
            > .ci-server/server.properties
          ls -lh .ci-server

      - name: Start Paper in background and wait for Done
        run: |
          set -uo pipefail
          cd .ci-server
          NORTHTEAM_SERVER_KEY="${{ secrets.NT_SERVER_KEY }}" \
          NORTHTEAM_API_BASE="$NT_API_BASE" \
            nohup java -Xmx1G -jar "$PAPER_JAR_NAME" --nogui > server.log 2>&1 &
          cd ..
          for i in $(seq 1 180); do
            grep -q 'Done (' .ci-server/server.log 2>/dev/null && break
            sleep 2
          done
          if grep -q 'Done (' .ci-server/server.log; then
            echo "服务端已就绪（Done）"
          else
            echo "服务端未在 360s 内就绪，客户端大概率连不上"
            tail -n 40 .ci-server/server.log
          fi

      - name: Launch headless clients and take screenshots
        env:
          SERVER_HOST: 127.0.0.1
          SERVER_PORT: '25565'
        run: |
          set -uo pipefail
          bash .github/scripts/client-shot.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: |
            client-shots/*.png
            client-result.txt
            .ci-client/client.log
            .ci-server/server.log
          if-no-files-found: warn
          retention-days: 30
