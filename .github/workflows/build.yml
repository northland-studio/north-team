# ==========================================================================
# NorthTeam 构建流水线
#
# 本仓库不做本地构建：所有编译与打包都在 GitHub Actions 上完成。
# 产物：Actions artifact「NorthTeam-jar」中的 build/libs/NorthTeam-<version>.jar
#
# 工具链：JDK 25 + Gradle 9.5.1（与同机 xuanjianmod 的 CI 保持一致）
# 注意：本仓库**不包含** gradle wrapper 二进制，因此这里使用 setup-gradle 提供的
#       gradle 命令，而不是 ./gradlew。
# ==========================================================================
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限：发布 ci-latest 滚动 Release（挂载构建出的 jar）

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build (fat jar via Shadow)
        run: gradle build --no-daemon --stacktrace

      # 滚动发布：把最新 jar 挂到固定 tag 的 Release 上。
      # 这样「安装/下载插件」不需要登录 GitHub，也不需要下载 Actions artifact
      # （artifact 即使公开仓库也必须带 token，401），直接给一个永久直链：
      #   https://github.com/northland-studio/north-team/releases/download/ci-latest/NorthTeam-<version>.jar
      - name: Publish rolling release (ci-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JAR="$(ls build/libs/NorthTeam-*.jar | grep -v -- '-sources' | grep -v -- '-javadoc' | head -1)"
          ls -lh "$JAR"
          gh release delete ci-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create ci-latest "$JAR" \
            --title "CI 最新构建（ci-latest）" \
            --notes "由 GitHub Actions 自动发布：提交 ${GITHUB_SHA:0:7}（$(date -u '+%Y-%m-%d %H:%M:%S UTC')）。

          安装：把 NorthTeam-*.jar 放进服务端 plugins/ 后重启；首次启动会生成 plugins/NorthTeam/config.yml，填写 api.base 与 api.server_key。详见 README。" \
            --prerelease
          echo "release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/ci-latest"

      - name: Show build output
        run: ls -lh build/libs

      # 免登录分发的第二条通道（备用，防止 Release 资产拿不到）：
      # 把 jar 推到一个只保留最新一次产物的 ci-artifacts 分支，直链形如
      #   https://raw.githubusercontent.com/<owner>/<repo>/ci-artifacts/NorthTeam-<version>.jar
      # raw 有 CDN 缓存，下载时可用 ?v=<sha> 破缓存。
      - name: Publish jar to ci-artifacts branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JAR="$(ls build/libs/NorthTeam-*.jar | grep -v -- '-sources' | grep -v -- '-javadoc' | head -1)"
          NAME="$(basename "$JAR")"
          STAGE="$(mktemp -d)"
          cp "$JAR" "$STAGE/$NAME"
          cd "$STAGE"
          git init -q
          git checkout -q -b ci-artifacts
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "$NAME" > latest.txt
          printf 'NorthTeam 最新构建产物\n\n文件：%s\n提交：%s\n时间：%s\n\n下载：\n  https://raw.githubusercontent.com/%s/ci-artifacts/%s\n' \
            "$NAME" "${GITHUB_SHA:0:7}" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "$GITHUB_REPOSITORY" "$NAME" > README.md
          git add "$NAME" latest.txt README.md
          git commit -qm "ci: NorthTeam ${GITHUB_SHA:0:7} 构建产物（$NAME）"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin ci-artifacts
          echo "下载直链: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-artifacts/${NAME}"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: NorthTeam-jar
          # 排除 sources/javadoc 之类的附属 jar，只保留可安装的插件 jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
